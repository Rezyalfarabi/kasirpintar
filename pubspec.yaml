name: kasir_pintar
description: Aplikasi Kasir Flutter untuk toko retail skala kecil-menengah
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  archive: ^3.6.1
  cached_network_image: ^3.3.1
  drift: ^2.18.0
  excel: ^4.0.6
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  mobile_scanner: ^5.0.0
  path: ^1.9.0
  path_provider: ^2.1.2
  pdf: ^3.11.0
  permission_handler: ^11.3.0
  printing: ^5.12.0
  riverpod_annotation: ^2.3.5
  share_plus: ^10.0.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.0
  uuid: ^4.4.0
  web: ^1.0.0

dev_dependencies:
  build_runner: ^2.4.9
  custom_lint: ^0.6.4
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - img/iconaplikasikasir.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
