<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kasir Pintar - aplikasi kasir untuk toko ritel.">
  <meta name="theme-color" content="#F5C400">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kasir Pintar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Basis data drift memakai keduanya saat dibuka. Preload memulai download
       lebih awal (paralel dengan mesin Flutter), jadi pembukaan basis data tidak
       menambah jeda setelah UI pertama dirender. -->
  <link rel="preload" href="sqlite3.wasm" as="fetch" type="application/wasm" crossorigin="anonymous">
  <link rel="preload" href="drift_worker.js" as="script">

  <title>Kasir Pintar</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* Layar ini tampil sampai frame pertama Flutter menggambar di atasnya.
       Flutter menambahkan elemennya ke DOM di atas loader, jadi loader
       otomatis tertutup begitu aplikasi siap. */
    #loading {
      position: fixed;
      inset: 0;
      z-index: -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #F5C400;
    }
    #loading .title {
      color: #111111;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    #loading .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(17, 17, 17, 0.25);
      border-top-color: #111111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="background-color: #F5C400">
  <div id="loading">
    <div class="title">Kasir Pintar</div>
    <div class="spinner"></div>
  </div>
  <script>
    // Build lama yang menempel di service worker membuat perubahan UI tidak
    // muncul walau aplikasi sudah dibangun ulang. Setiap kali dimuat, daftar
    // service worker dan cache lamanya dibersihkan supaya yang tampil selalu
    // build terbaru dari server.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister();
        });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) {
          caches.delete(key);
        });
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
